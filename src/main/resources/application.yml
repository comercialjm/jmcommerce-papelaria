spring:
  application:
    name: loja-papelaria
  profiles:
    default: dev # usado somente se nenhum perfil for ativado por fora (env var, --spring.profiles.active, etc.)
  servlet:
    multipart:
      max-file-size: 5MB  # RN-03: máx 5MB por imagem
      max-request-size: 10MB
  web:
    resources:
      # RT-11: cache agressivo + cache-busting por hash de conteúdo. Cada arquivo
      # estático ganha uma URL com hash (ex: base-a1b2c3d4.css) que só muda quando
      # o CONTEÚDO muda — assim dá pra cachear "para sempre" sem risco de servir
      # uma versão desatualizada depois de um novo deploy.
      cache:
        cachecontrol:
          max-age: 365d
        add-last-modified: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é sempre gerenciado pelo Flyway, nunca pelo Hibernate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

melhorenvio:
  base-url: ${MELHOR_ENVIO_BASE_URL:https://sandbox.melhorenvio.com.br}
  token: ${MELHOR_ENVIO_TOKEN:}
  user-agent: ${MELHOR_ENVIO_USER_AGENT:Loja de Papelaria (contato@lojadepapelaria.com.br)}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Em produção (Render), RENDER_EXTERNAL_URL já vem preenchido automaticamente pela
  # plataforma — não precisa configurar nada manualmente lá. Localmente cai no default.
  app-base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}

resend:
  api-key: ${RESEND_API_KEY:}
  # Resend exige um domínio verificado para o "from". Em desenvolvimento/sandbox,
  # use o domínio de teste deles: onboarding@resend.dev (só envia para o e-mail
  # cadastrado na sua conta Resend). Troque para um domínio real antes do lançamento.
  from-email: ${RESEND_FROM_EMAIL:Loja de Papelaria <onboarding@resend.dev>}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
