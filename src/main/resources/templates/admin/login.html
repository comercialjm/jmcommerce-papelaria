<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login administrativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 0 var(--espaco-4);">

    <div style="max-width:420px; width:100%; padding:44px 40px; border:1px solid var(--cor-borda); border-radius:var(--raio-card); background:var(--cor-papel); box-shadow: 0 8px 32px rgba(43,38,32,0.08);">
        <div style="text-align:center; font-family:var(--fonte-display); font-size:1.6rem; margin-bottom:28px;">
            Loja de Papelaria
        </div>

        <div th:if="${param.erro}" class="aviso-carrinho">
            E-mail ou senha incorretos.
        </div>
        <div th:if="${param.saiu}" style="background:var(--cor-sucesso-fundo); color:var(--cor-sucesso); padding:10px 14px; border-radius:8px; font-size:var(--tamanho-pequeno); margin-bottom:var(--espaco-4);">
            Sessão encerrada.
        </div>
        <div th:if="${param.bloqueado}" class="aviso-carrinho">
            Muitas tentativas. Tente novamente em 30 minutos.
        </div>

        <form method="post" th:action="@{/admin/login}">
            <label class="etiqueta">E-mail</label>
            <input type="email" name="username" required autofocus
                   style="width:100%; height:44px; padding:0 14px; margin:6px 0 18px; border:1px solid var(--cor-borda); border-radius:var(--raio-botao); font-family:var(--fonte-corpo); font-size:var(--tamanho-corpo);">

            <label class="etiqueta">Senha</label>
            <input type="password" name="password" required
                   style="width:100%; height:44px; padding:0 14px; margin:6px 0 26px; border:1px solid var(--cor-borda); border-radius:var(--raio-botao); font-family:var(--fonte-corpo); font-size:var(--tamanho-corpo);">

            <button type="submit" class="botao botao-primario" style="width:100%; height:46px;">Entrar</button>
        </form>
    </div>

</body>
</html>
